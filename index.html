  <script>
    (async function loadTuxComponents() {
      const components = [
        {
          file: 'html/navigation.html',
          container: 'navigation-container'
        },
        {
          file: 'html/cashier.html',
          container: 'cashier-container'
        },
        {
          file: 'html/kitchen.html',
          container: 'kitchen-container'
        },
        {
          file: 'html/expenses.html',
          container: 'expenses-container'
        },
        {
          file: 'html/stock.html',
          container: 'stock-container'
        },
        {
          file: 'html/hawalk.html',
          container: 'hawalk-container'
        },
        {
          file: 'html/workers.html',
          container: 'workers-container'
        },
        {
          file: 'html/gamiya.html',
          container: 'gamiya-container'
        },
        {
          file: 'html/reports.html',
          container: 'reports-container'
        },
        {
          file: 'html/settings.html',
          container: 'settings-container'
        },

        {
          file: 'html/modals.html',
          container: 'modals-container'
        },
        {
          file: 'html/print.html',
          container: 'print-container'
        },
      ];

      try {
        for (const component of components) {
          const response = await fetch(component.file);

          if (!response.ok) {
            throw new Error(
              `Failed to load ${component.file}: ${response.status}`
            );
          }

          const html = await response.text();

          let container = document.getElementById(component.container);

          if (!container) {
            container = document.createElement('div');
            container.id = component.container;

            if (component.container === 'navigation-container') {
              document.body.insertBefore(container, document.body.firstChild);
            } else {
              document.body.appendChild(container);
            }
          }

          container.innerHTML = html;
        }

        const mainScript = document.createElement('script');
        mainScript.src = 'js/main.js';
        mainScript.onerror = function () {
          console.error('Failed to load js/main.js');
          alert('TUX POS could not start. Please refresh the page.');
        };

        document.body.appendChild(mainScript);
      } catch (error) {
        console.error('TUX POS component loading failed:', error);
        alert(
          'TUX POS could not load a page component. Check the browser console.'
        );
      }
    })();
  </script>
