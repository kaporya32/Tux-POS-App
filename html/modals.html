 <!-- =========================================================
       STAFF LOGIN / LOGOUT MODAL
       ========================================================= -->
  <div class="staff-modal" id="staffLoginModal">
    <div class="staff-modal-box">
      <h3 id="staffModalTitle">
        👤 Staff Login
      </h3>
      <div class="staff-modal-info" id="staffModalInfo">
        Enter your staff password
      </div>
      <input type="password" id="staffPasswordInput" class="staff-password-input" placeholder="Enter password"
        onkeydown="if(event.key === 'Enter') staffModalAction()">
      <div class="staff-modal-buttons">
        <button class="staff-modal-cancel" onclick="closeStaffLogin()">
          Cancel
        </button>
        <button class="staff-modal-login" id="staffModalActionBtn" onclick="staffModalAction()">
          Login
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
     TUX POS — SHIFT CONFIRMATION MODAL
     ========================================================= -->

<div
  class="staff-modal"
  id="shiftConfirmModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="shiftConfirmTitle"
  style="display: none;"
>
  <div class="staff-modal-box">

    <h3 id="shiftConfirmTitle">
      Confirm Action
    </h3>

    <div
      class="staff-modal-info"
      id="shiftConfirmMessage"
      style="white-space: pre-line;"
    ></div>

    <div class="staff-modal-buttons">

      <button
        type="button"
        class="staff-modal-cancel"
        id="shiftConfirmCancelBtn"
        onclick="closeShiftConfirmModal()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="staff-modal-login"
        id="shiftConfirmActionBtn"
        onclick="confirmShiftModalAction()"
      >
        Confirm
      </button>

    </div>

  </div>
</div>
